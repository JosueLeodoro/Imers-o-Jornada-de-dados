version: 2

models:
  - name: bronze_vendas
    description: "Perspectiva bronze transacional de vendas (copia da origem)."
    columns:
      - name: id_venda
        description: "ID unico da venda"
        tests:
          - unique
          - not_null
      - name: id_cliente
        description: "ID do cliente"
        tests:
          - not_null
      - name: id_produto
        description: "ID do produto"
        tests:
          - not_null
      - name: canal_venda
        description: "Canal em que a venda ocorreu"
        tests:
          - accepted_values:
              values: ['ecommerce', 'loja_fisica']
